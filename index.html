<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연수 자료</title>
<meta name="description" content="연수에서 쓰는 자료와 도구 모음">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2316171a'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%23e4003a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
<style>
  /* 순서 바꾸기 */
  .editbar { border:1px solid var(--ink); border-radius:14px; background:var(--card); padding:18px 20px; margin-bottom:20px; }
  .editbar p { margin:0 0 10px; font-size:15.5px; }
  .editbar code { display:block; padding:10px 12px; margin:10px 0; font-size:14.5px; user-select:all; }
  .editbar .actions { margin-top:12px; }
  .editbar .btn { padding:8px 14px; font-size:15px; }
  .wall.editing .card { cursor:grab; user-select:none; }
  .wall.editing .card.dragging { opacity:.35; }
  .wall.editing .card.over { border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
  .move { display:flex; gap:6px; margin-top:16px; }
  .move button { border:1px solid var(--line); background:none; color:var(--ink); border-radius:8px; width:44px; height:38px; font:inherit; font-size:16px; cursor:pointer; }
  .move button:disabled { opacity:.3; cursor:default; }
  .linkbtn { border:0; background:none; color:inherit; font:inherit; text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:0; }
</style>
</head>
<body>
<div class="top"><div class="in wide">
  <a class="brand" href="./">연수 자료<i>.</i></a>
</div></div>

<main class="in wide">
  <div class="head">
    <h1>연수 자료</h1>
    <p class="lead">수행평가 페이지를 재료로 Claude Code에 입문하는 연수입니다. 연수 전에는 “연수 전 준비”를, 연수 날에는 “실습”을 엽니다.</p>
  </div>
  <div class="editbar" id="editbar" hidden>
    <p><b>순서 바꾸기</b> — 카드를 끌어 놓거나 화살표를 눌러 순서를 바꾸세요. 바꾼 순서는 <b>이 기기에서만</b> 보입니다.</p>
    <p>모든 사람에게 같은 순서로 보이게 하려면, 아래 줄을 복사해 Claude에게 보내면 사이트에 반영해 줍니다.</p>
    <code id="orderText"></code>
    <div class="actions"><button class="btn" id="copyOrder">복사</button><button class="btn" id="resetOrder">원래 순서로</button><button class="btn primary" id="doneEdit">끝내기</button></div>
  </div>
  <div class="filters" id="filters" role="group" aria-label="분류"></div>
  <div class="wall" id="wall"></div>
</main>

<footer><div class="in wide"><span>연수 자료</span><button class="linkbtn" id="startEdit">카드 순서 바꾸기</button></div></footer>

<script>
/* ───────── 카드 목록: 자료를 올릴 때는 여기에 한 덩어리만 추가하면 됩니다 ─────────
   id     영문 이름(순서 저장에 씀)   title  제목       cat  분류(같은 글자면 같은 묶음)
   desc   한 줄 설명                 points 상세 사항 2~3줄
   href   눌렀을 때 갈 곳 (비워 두면 '준비 중' 카드)
   모든 사람에게 보이는 기본 순서는 이 목록의 순서입니다.                              */
const CARDS = [
  { id: "prep", title: "연수 전 준비", cat: "연수 전", href: "prep/",
    desc: "연수 전에 해 올 것: VS Code와 Claude Code 설치, 구독 계정 로그인",
    points: ["붙여넣을 명령 세 덩어리", "화면으로 따라 하는 순서", "막힐 때 보는 곳"] },
  { id: "practice", title: "실습: Claude Code 첫걸음", cat: "연수 날", href: "practice/",
    desc: "VS Code에서 수행평가 본보기 폴더를 열고 Claude Code를 처음 써 보는 순서",
    points: ["본보기 폴더 받아 열기", "묻기, 고치기, 확인하기, 되돌리기", "내 수업에 쓸 것을 계획해 보기"] },
  { id: "writing", title: "영어 쓰기 수행평가 페이지", cat: "연수 날", href: "writing/",
    desc: "실습의 재료. 체험해 보고, 연수 뒤에 내 수업용으로 설치하는 방법까지",
    points: ["설치 없이 체험해 보기", "내 수업용으로 설치: GitHub 가입부터", "과제 바꾸기, 수업 운영, 알아 둘 것"] },
  { id: "devenv", title: "발표 정리: 구조와 계획", cat: "자료", href: "devenv/",
    desc: "발표한 내용을 글로 옮긴 것. 구조를 틀로 Claude Code와 계획하는 방법",
    points: ["네 층과 계획 대화의 순서", "왜 VS Code와 터미널인가", "자료가 가는 길, 용어"] },
  { id: "coolwatch", title: "쿨메신저 보조도구", cat: "자료", href: "coolwatch/",
    desc: "쿨메신저로 받은 업무 메시지에서 할 일·기한·일정을 뽑아 카드로 정리하는 도구 (선택)",
    points: ["설치.bat 한 번으로 설치", "Claude 요약, 노션 연결은 선택", "첨부 파일은 눌러서 바로 열기"] },
];
/* ─────────────────────────────────────────────────────────────────────────────── */

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ORDER_KEY = "hub-order-v2";
let current = "전체", editing = false, dragId = null;

// 이 기기에 저장해 둔 순서가 있으면 그 순서로 (없는 카드는 뒤에 붙임)
function ordered() {
  let mine = [];
  try { mine = JSON.parse(localStorage.getItem(ORDER_KEY) || "[]"); } catch (e) {}
  const byId = Object.fromEntries(CARDS.map(c => [c.id, c]));
  const out = mine.filter(id => byId[id]).map(id => byId[id]);
  return out.concat(CARDS.filter(c => !out.includes(c)));
}
function saveOrder(ids) { try { localStorage.setItem(ORDER_KEY, JSON.stringify(ids)); } catch (e) {} }

function draw() {
  const all = ordered();
  const cats = ["전체", ...new Set(CARDS.map(c => c.cat))];
  $("filters").hidden = editing;
  $("filters").innerHTML = cats.map(c => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${c === current}">${esc(c)}</button>`).join("");
  const list = all.filter(c => editing || current === "전체" || c.cat === current);
  $("wall").classList.toggle("editing", editing);
  $("wall").innerHTML = list.length ? list.map((c, i) => {
    const ready = !!c.href, tag = ready && !editing ? "a" : "div";
    return `<${tag} class="card${ready ? "" : " soon"}" data-id="${esc(c.id)}" ${tag === "a" ? `href="${esc(c.href)}"` : ""} ${editing ? 'draggable="true"' : ""}>
      <div class="cat">${esc(c.cat)}${ready ? "" : " <b>준비 중</b>"}</div>
      <h3>${esc(c.title)}</h3>
      ${ready ? `<p class="desc">${esc(c.desc)}</p>` : ""}
      ${(c.points || []).length && !editing ? `<ul>${c.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
      ${editing ? `<div class="move"><button data-move="-1" aria-label="앞으로" ${i === 0 ? "disabled" : ""}>←</button><button data-move="1" aria-label="뒤로" ${i === list.length - 1 ? "disabled" : ""}>→</button></div>`
                : ready ? '<div class="go">열기 →</div>' : ""}
    </${tag}>`;
  }).join("") : '<p class="empty">이 분류에는 아직 카드가 없습니다.</p>';
  $("editbar").hidden = !editing;
  $("orderText").textContent = "카드 순서: " + all.map(c => c.id).join(", ");
  $("startEdit").hidden = editing;
}

function move(id, to) {   // to: 옮겨 갈 자리(0부터)
  const ids = ordered().map(c => c.id), from = ids.indexOf(id);
  if (from < 0 || to < 0 || to >= ids.length || from === to) return;
  ids.splice(to, 0, ids.splice(from, 1)[0]);
  saveOrder(ids); draw();
}

$("filters").addEventListener("click", e => { const b = e.target.closest("[data-cat]"); if (b) { current = b.dataset.cat; draw(); } });
$("startEdit").onclick = () => { editing = true; current = "전체"; draw(); window.scrollTo({ top: 0, behavior: "smooth" }); };
$("doneEdit").onclick = () => { editing = false; draw(); };
$("resetOrder").onclick = () => { try { localStorage.removeItem(ORDER_KEY); } catch (e) {} draw(); };
$("copyOrder").onclick = async () => {
  const t = $("orderText").textContent;
  try { await navigator.clipboard.writeText(t); $("copyOrder").textContent = "복사됨"; } catch (e) { $("copyOrder").textContent = "위 줄을 직접 복사하세요"; }
  setTimeout(() => $("copyOrder").textContent = "복사", 1800);
};
const wall = $("wall");
wall.addEventListener("click", e => {
  const b = e.target.closest("[data-move]");
  if (!b) return;
  const id = b.closest(".card").dataset.id, ids = ordered().map(c => c.id);
  move(id, ids.indexOf(id) + Number(b.dataset.move));
});
wall.addEventListener("dragstart", e => { const c = e.target.closest(".card"); if (!c || !editing) return; dragId = c.dataset.id; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragId); });
wall.addEventListener("dragend", () => { dragId = null; wall.querySelectorAll(".dragging, .over").forEach(el => el.classList.remove("dragging", "over")); });
wall.addEventListener("dragover", e => { const c = e.target.closest(".card"); if (!editing || !dragId || !c) return; e.preventDefault(); wall.querySelectorAll(".over").forEach(el => el.classList.remove("over")); if (c.dataset.id !== dragId) c.classList.add("over"); });
wall.addEventListener("drop", e => { const c = e.target.closest(".card"); if (!editing || !dragId || !c) return; e.preventDefault(); move(dragId, ordered().map(x => x.id).indexOf(c.dataset.id)); });
draw();
</script>
</body>
</html>
